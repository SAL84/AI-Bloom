# aibloom Space — generated by the migrate-to-atlas skill.
#
# NOTE: do not create a `.env` file beside this one. Compose auto-reads a file
# with that exact name, and projects here routinely hold their own unrelated
# `.env` files loaded by a different mechanism. Keep compose variables inline;
# if a file is ever needed, name it compose.env and pass --env-file explicitly.

name: aibloom

services:

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Parameterised so files written through the bind mount are owned by the
        # host user rather than root. atlas is 1000.
        HOST_UID: "1000"
        HOST_GID: "1000"
    image: aibloom:dev
    container_name: aibloom-dev
    hostname: aibloom-dev

    # State is sticky per Space: whatever was running before an atlas reboot
    # comes back, whatever you stopped stays stopped. No global policy needed.
    restart: unless-stopped

    # sleep infinity, not the app: if the app were PID 1 a crash would kill the
    # container and take any Claude session with it. The entrypoint starts the
    # app in a detached tmux session instead.
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

    volumes:
      # The ONE bind mount. Everything the Space needs lives under it — which is
      # why code from outside the tree is moved IN during migration rather than
      # mounted separately.
      - type: bind
        source: .
        target: /workspace
      # Claude auth/history/memory survives image rebuilds. Without this you
      # re-authenticate on every build.
      - aibloom-claude:/home/dev/.claude
      # Git credential store, isolated from the workspace on purpose so the
      # token cannot leak into a repo, a build context, or a backup.
      - aibloom-git:/home/dev/.git-secrets

    environment:
      # Persist Claude Code account + onboarding state on the volume. Without this a
      # container RECREATE wipes ~/.claude.json at HOME root and forces re-auth.
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      TZ: Asia/Amman
      START_APP: "1"

      # Declared here rather than configured by hand inside the container:
      # ~/.gitconfig is NOT a volume, so a rebuild would silently drop the
      # identity and every commit would fail with "Author identity unknown".
      # The entrypoint re-applies these on every start.
      GIT_USER_NAME: "Salih A"
      GIT_USER_EMAIL: "90107378+SAL84@users.noreply.github.com"

      # gh's auth (hosts.yml) lives on the aibloom-git volume, not in the
      # writable layer — otherwise a rebuild silently logs GitHub out. All
      # GitHub interaction for this project happens from atlas.
      GH_CONFIG_DIR: /home/dev/.git-secrets/gh

      # A CPU quota does not change what nproc reports inside the container:
      # OpenBLAS would see every host thread, spawn that many, and contend over
      # the quota. Harmless to set even for projects without numpy.
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_MAX_THREADS: "2"

    ports:
      # Host loopback ONLY. The app binds 0.0.0.0 INSIDE the container because
      # Docker's published port cannot reach the container's own loopback — that
      # is safe only while this stays 127.0.0.1. Changing it to 0.0.0.0 would
      # expose the app to the whole tailnet.
      #   ssh -L 5005:127.0.0.1:5005 sal@atlas
      - "127.0.0.1:5005:5005"

    mem_limit: 2g
    mem_reservation: 512m
    # Equal to mem_limit means ZERO swap. A leaking container then dies a clean
    # OOM-kill instead of degrading into silent thrash. The kill is wanted — it
    # reports; thrash does not.
    memswap_limit: 2g
    cpus: 2
    pids_limit: 2048

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # No cron service: this Space schedules nothing.

volumes:
  aibloom-claude:
  aibloom-git:
